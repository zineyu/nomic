name: nomic_app
description: Nomic Flutter GUI — connects to `nomic --serve` event stream (ADR-0046).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  flutter_markdown: ^0.7.4
  # vendored 修复版（Flutter 3.44 起 IconData 为 final class，官方 0.257.0
  # 通过 extends IconData 实现，已无法编译；见 packages/lucide_icons）
  lucide_icons:
    path: packages/lucide_icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
