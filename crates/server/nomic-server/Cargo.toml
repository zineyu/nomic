[package]
name = "nomic-server"
description = "nomic 常驻 server：受理、调度、worker 与 IPC 服务端（骨架）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.31"
nomic-core = { path = "../../core/nomic-core", version = "0.4.0" }
rusqlite = { version = "0.40.2", default-features = false, features = [
  "bundled",
] }
schemars = "1.0.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.53.3", features = ["fs", "process", "rt"] }

[dev-dependencies]
futures = "0.3.31"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
