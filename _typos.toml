# typos 拼写检查：https://github.com/crate-ci/typos
[default]
locale = "en"

[files]
extend-exclude = [
  "Cargo.lock",
  "*.svg",
  "*.min.*",
  # Flutter GUI 构建产物
  "app/.dart_tool/**",
  "app/build/**",
  # Xcode 脚手架由 flutter create 生成（hex ID / xib ID 大量误报），不手维护
  "app/macos/**",
]

# 项目专有词汇白名单（被误报时追加）
[default.extend-words]
nomic = "nomic"
ratatui = "ratatui"
# config 测试中故意拼错的键名（验证 deny_unknown_fields 硬报错）
contex = "contex"
