[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/zineyu/nomic"

# 共享依赖统一在此声明版本，crate 内使用 `dep.workspace = true` 引用。
[workspace.dependencies]
# ── 内部 crate ──────────────────────────────────────────────────────────────
nomic-ai = { path = "crates/nomic-ai", version = "0.1.0" }
nomic-core = { path = "crates/nomic-core", version = "0.1.0" }
nomic-prompts = { path = "crates/nomic-prompts", version = "0.1.0" }
nomic-session = { path = "crates/nomic-session", version = "0.1.0" }
nomic-skills = { path = "crates/nomic-skills", version = "0.1.0" }
nomic-tools = { path = "crates/nomic-tools", version = "0.1.0" }

# ── 异步运行时与工具 ─────────────────────────────────────────────────────────
tokio = { version = "1.53", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "process",
  "io-util",
  "time",
  "sync",
  "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# ── HTTP / SSE ──────────────────────────────────────────────────────────────
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "json",
  "charset",
  "http2",
  "system-proxy",
] }
eventsource-stream = "0.2"

# ── 序列化与 schema ─────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
toml = "1.1"

# ── 持久化（nomic-session）──────────────────────────────────────────────────
# 不用 query! 编译期宏，无需 DATABASE_URL；migrate 用于内嵌迁移
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "sqlite",
  "migrate",
  "macros",
] }
uuid = { version = "1", features = ["v7"] }

# ── 错误处理 ────────────────────────────────────────────────────────────────
anyhow = "1.0"
thiserror = "2.0"

# ── 日志（tracing）─────────────────────────────────────────────────────────
# 库 crate 只依赖 tracing 发事件；subscriber/appender 仅 nomic-cli 装配
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── TUI（nomic-cli）─────────────────────────────────────────────────────────
ratatui = "0.30"
unicode-width = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }

# ── CLI ─────────────────────────────────────────────────────────────────────
clap = { version = "4.6", features = ["derive"] }

# ── 图片附件 base64 编码（nomic-cli）────────────────────────────────────────
base64 = "0.22"

# ── 剪贴板图片粘贴（nomic-cli TUI）──────────────────────────────────────────
# wayland-data-control：Wayland 剪贴板优先于 X11（运行时 dlopen，无构建期依赖）
arboard = { version = "3.6", features = ["wayland-data-control"] }
# 剪贴板 RGBA 像素 → PNG 编码
png = "0.18"

# ── 文本处理（nomic-tools）─────────────────────────────────────────────────
similar = "3"
unicode-normalization = "0.1"

# ── 内容搜索与文件查找（nomic-tools 的 grep/find 工具）──────────────────────
# grep-regex/grep-searcher 是 ripgrep 官方的搜索引擎库（行匹配、二进制检测、
# 编码处理）；ignore/globset 是 ripgrep 与 fd 共用的遍历与 glob 匹配库。
# 全部以库形式集成，无需外部二进制（与 ADR 0006 的 nix 打包目标一致）
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
globset = "0.4"

# ── 进程组管理（nomic-tools 的 bash 工具超时强杀）───────────────────────────
# killpg 是 safe 封装（workspace 禁用 unsafe_code）；仅启用所需 feature
nix = { version = "0.29", default-features = false, features = [
  "signal",
  "process",
] }

# ── Markdown 渲染（nomic-cli TUI）──────────────────────────────────────────
# 仅需 pull parser，裁剪 html/getopts 等默认 feature
pulldown-cmark = { version = "0.13", default-features = false }

# ── 时间展示（nomic-cli sessions list）──────────────────────────────────────
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# ── 测试 ────────────────────────────────────────────────────────────────────
tokio-test = "0.4"
tempfile = "3"

# ── Lint 配置：严格但实用 ────────────────────────────────────────────────────
# 所有 crate 通过 `[lints] workspace = true` 继承。
# - rustc / clippy::all / pedantic / nursery / cargo 全部 deny
# - 少数公认噪音大的 lint 显式 allow（有理由、可枚举）
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# pedantic 中噪音过大的文档类 lint，允许（文档应写，但不强制每个错误类型成文）
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 模块名重复在领域建模中常常是可读性更好的选择
module_name_repetitions = "allow"
# 每个返回值的函数都标 #[must_use] 过于繁琐
must_use_candidate = "allow"
# nursery 中纯风格偏好、与主流习惯冲突的 lint
use_self = "allow"
option_if_let_else = "allow"
# cargo 组中要求 crates.io 发布元数据（readme/keywords/categories），
# 内部 workspace 无需强制；发布到 crates.io 时移除本行并补全 metadata
cargo_common_metadata = "allow"
# 传递依赖的多版本（syn 2/3、windows-sys 等）不受本仓库控制，无法消除
multiple_crate_versions = "allow"
# 中文文档中夹杂标识符（OpenAI、stop_reason 等）会大量误报，收益低于噪音
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
