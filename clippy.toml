# 与 rust-toolchain.toml 保持一致，超出 MSRV 语法的 lint 自动降级
msrv = "1.97"
# 允许 re-export 不破坏 API 的检查（发布到 crates.io 时再开）
avoid-breaking-exported-api = false
# 圈复杂度阈值（默认 25，略放宽避免过度拆函数）
cognitive-complexity-threshold = 30
# 单函数最大行数（含注释与空行，默认即 100；显式声明以固化约束）
# lint 本身由 workspace lints 的 clippy::pedantic deny 启用
too-many-lines-threshold = 100
