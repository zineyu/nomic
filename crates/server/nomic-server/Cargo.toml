[package]
name = "nomic-server"
description = "nomic 常驻 server：受理、调度、worker 与 IPC 服务端（骨架）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nomic-core = { path = "../../core/nomic-core", version = "0.4.0" }
rusqlite = { version = "0.40.2", default-features = false, features = [
  "bundled",
] }
serde_json = "1.0.140"
tokio = { version = "1.53.3", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
