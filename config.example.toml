# nomic 示例配置文件
#
# 复制到平台标准配置目录下的 nomic/config.toml 后按需修改
#（Linux：$XDG_CONFIG_HOME，缺省 ~/.config；macOS：~/Library/Application Support）。
# 全部字段可选；未知键或非法取值会在启动时硬报错（防拼写错误）。
#
# 优先级总览：
#   provider / 模型选择：不在本文件中——经 TUI `/models` 命令选择（可跨 provider，
#     `<provider>/<模型id>` 格式），结果保存在 sqlite 配置表；启动时按
#     CLI 参数 > sqlite 配置（从最新向最老逐条回退）解析；两层都没有时启动报错
#     （无内置默认 provider / 模型，必须显式指定）
#   连接参数（base_url / api_key）：CLI 参数 > 环境变量 > providers 表 > 平铺配置 > 协议默认
#   模型规格（name / reasoning 能力 / context_window / max_tokens / cost_*）：
#     providers.<名字>.models."<模型id>" > models.dev > 中性兜底（全零）
#
# 迁移说明：旧版的选择器键 provider / model 已从本文件移除（按未知键硬报错），
# 请改用 `/models` 命令或 --provider / --model 参数。

# ── 平铺连接/请求参数 ────────────────────────────────────────────────────────

# API base URL（优先级低于 [providers.<名字>].base_url；openai 系也可用 OPENAI_BASE_URL）
# base_url = "https://your.gateway/v1"

# API key（最低优先级兜底；优先级：--api-key > ANTHROPIC_API_KEY/OPENAI_API_KEY >
# [providers.<名字>].api_key > 本键。建议优先用环境变量，避免明文落盘）
# api_key = "sk-..."

# 思考级别（请求参数，不是模型能力）：minimal / low / medium / high；缺省不开启
# （TUI 内 /models 选择模型后可调整，含 off 关闭）
# reasoning = "low"

# 采样温度（请求参数）
# temperature = 0.7

# 单次请求最大输出 token 数（请求参数，不是模型能力上限）
# max_tokens = 8192

# 追加到系统提示词末尾的文本
# append_system = "总是用中文回复。"

# ── prompt templates ─────────────────────────────────────────────────────────
# prompt template 是 .md 文件，文件名（去掉 .md）即 /name 命令名，正文是模板，
# 支持 $1 / $@ / ${1:-default} / ${@:N:L} 等参数占位符。自动发现（非递归）：
#   项目级 .nomic/prompts/*.md（从 cwd 向上查找，越近越优先）
#   用户级 <配置目录>/nomic/prompts/*.md（Linux：$XDG_CONFIG_HOME，缺省 ~/.config）
# 下面可追加显式文件或目录（同名时优先级最高）；也可用 --prompt-template 指定、
# --no-prompt-templates 关闭目录发现。
# prompts = ["prompts/review.md", "~/.local/share/nomic/prompts"]

# ── 上下文压缩 ──────────────────────────────────────────────────────────────
# 上下文逼近模型窗口时自动把较早消息压缩为结构化摘要；TUI 内也可随时用
# /compact [聚焦指令] 手动触发（不受 enabled 开关影响）。

# [compaction]
# enabled = true           # 自动压缩开关
# reserve_tokens = 16384   # 为模型响应预留的 token 数
# keep_recent_tokens = 20000  # 保留不压缩的近期 token 数（估算口径）

# ── provider 定义 ────────────────────────────────────────────────────────────
# provider 与 base_url 永远来自这里的用户指定，不经由 models.dev；
# 没有内置 provider——`/models` 选择器只列出这里定义的名字（外加当前模型的
# provider）。anthropic / openai 两个名字可按名推断 api，其余名字 api 必填。

[providers.anthropic]
base_url = "https://api.anthropic.com"
# api 可省略：anthropic→anthropic_messages，openai→open_ai_completions 自动推断
# api_key = "sk-ant-..."

[providers.openai]
base_url = "https://api.openai.com/v1"

# 自定义 provider（兼容端点）：api 必填
[providers.deepseek]
api = "open_ai_completions"              # 或 anthropic_messages
base_url = "https://api.deepseek.com/v1"
# api_key = "sk-..."

# ── 模型规格覆盖 ─────────────────────────────────────────────────────────────
# 全部字段可选，只写要覆盖的；缺失字段继续向 models.dev、中性兜底（全零）解析。
# 模型 id 只有在这里显式定义、或存在于 models.dev 目录时才可用（启动与 /models 校验）；
# 写全 8 个字段后不再访问 models.dev（不读缓存、不联网）。

[providers.anthropic.models."claude-sonnet-4-5"]
name = "Claude Sonnet 4.5" # 展示名
reasoning = true           # 模型能力：是否支持推理/思考
context_window = 200000    # 上下文窗口 token 数
max_tokens = 64000         # 模型最大输出 token 数
cost_input = 3.0           # 每百万 token 费率：输入
cost_output = 15.0         # 每百万 token 费率：输出
cost_cache_read = 0.3      # 每百万 token 费率：缓存读取
cost_cache_write = 3.75    # 每百万 token 费率：缓存写入

# 只覆盖一个字段，其余走 models.dev → 中性兜底
[providers.deepseek.models."deepseek-chat"]
max_tokens = 8192
