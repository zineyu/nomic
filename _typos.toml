# typos 拼写检查：https://github.com/crate-ci/typos
[default]
locale = "en"

[files]
extend-exclude = [
  "Cargo.lock",
  "*.svg",
  "*.min.*",
  # Web UI 构建产物与依赖（node_modules 体量巨大且拼写不受控）
  "web/node_modules/**",
  "web/dist/**",
  "web/storybook-static/**",
  "web/coverage/**",
  "web/package-lock.json",
]

# 项目专有词汇白名单（被误报时追加）
[default.extend-words]
nomic = "nomic"
ratatui = "ratatui"
# config 测试中故意拼错的键名（验证 deny_unknown_fields 硬报错）
contex = "contex"
