[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zine/nomic"

[workspace.dependencies]
# 共享依赖统一在此声明版本，crate 内使用 `dep.workspace = true` 引用。

# ── Lint 配置：严格但实用 ────────────────────────────────────────────────────
# 所有 crate 通过 `[lints] workspace = true` 继承。
# - rustc / clippy::all / pedantic / nursery / cargo 全部 deny
# - 少数公认噪音大的 lint 显式 allow（有理由、可枚举）
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# pedantic 中噪音过大的文档类 lint，允许（文档应写，但不强制每个错误类型成文）
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 模块名重复在领域建模中常常是可读性更好的选择
module_name_repetitions = "allow"
# 每个返回值的函数都标 #[must_use] 过于繁琐
must_use_candidate = "allow"
# nursery 中纯风格偏好、与主流习惯冲突的 lint
use_self = "allow"
option_if_let_else = "allow"
# cargo 组中要求 crates.io 发布元数据（readme/keywords/categories），
# 内部 workspace 无需强制；发布到 crates.io 时移除本行并补全 metadata
cargo_common_metadata = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
