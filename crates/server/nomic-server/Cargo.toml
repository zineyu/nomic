[package]
name = "nomic-server"
description = "nomic 常驻 server：受理、调度、worker 与 IPC 服务端（骨架）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.55", features = ["derive"] }
futures-util = "0.3.31"
nix = { version = "0.30.1", features = ["fs", "process", "signal"] }
nomic-ai = { path = "../../ai/nomic-ai", version = "0.4.0" }
nomic-core = { path = "../../core/nomic-core", version = "0.4.0" }
rusqlite = { version = "0.40.2", default-features = false, features = [
  "bundled",
] }
schemars = "1.0.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "1.1.8"
tokio = { version = "1.53.3", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }

[dev-dependencies]
futures = "0.3.31"
nomic-ai = { path = "../../ai/nomic-ai", version = "0.4.0", features = [
  "testing",
] }
tempfile = "3.27.0"

[[bin]]
name = "nomic"
path = "src/main.rs"
