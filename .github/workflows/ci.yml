name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI 与本地开发共用同一份 devenv 环境：
# - 工具链 / 检查工具版本由 rust-toolchain.toml 与 devenv.lock 唯一决定
# - 检查项由 devenv.nix 中的 `check` 脚本定义，本地 `check` 与 CI 完全等价
# 参考：https://devenv.sh/integrations/github-actions/

jobs:
  check:
    name: devenv check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # 使用 devenv 官方公共二进制缓存，加速 shell 构建
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # 缓存 cargo registry 与 target 目录（nix store 由 cachix 覆盖）
      - uses: Swatinem/rust-cache@v2

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      # 运行 git-hooks（rustfmt/taplo/typos/trailing-whitespace/EOF 等提交前检查）
      - name: Run git hooks
        run: devenv test

      # 运行与本地完全一致的完整检查（fmt/clippy/test/doctest/doc/deny/audit/machete/taplo/typos）
      - name: Run checks
        run: devenv shell check

  # 保证 flake.nix 不腐烂：构建 nomic 包并运行 crane check 阶段的测试
  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: nix flake check
        run: nix flake check --print-build-logs
