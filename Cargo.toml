[workspace]
resolver = "3"
members = [
  "crates/ai/nomic-ai",
  "crates/core/nomic-core",
  "crates/server/nomic-server",
  "crates/tui/nomic-tui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/zineyu/nomic"

# ── Lint 配置：严格但实用 ────────────────────────────────────────────────────
# 所有 crate 通过 `[lints] workspace = true` 继承。
# - rustc / clippy::all / pedantic / nursery / cargo 全部 deny
# - 少数公认噪音大的 lint 显式 allow（有理由、可枚举）
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# pedantic 中噪音过大的文档类 lint，允许（文档应写，但不强制每个错误类型成文）
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 模块名重复在领域建模中常常是可读性更好的选择
module_name_repetitions = "allow"
# 每个返回值的函数都标 #[must_use] 过于繁琐
must_use_candidate = "allow"
# nursery 中纯风格偏好、与主流习惯冲突的 lint
use_self = "allow"
option_if_let_else = "allow"
# cargo 组中要求 crates.io 发布元数据（readme/keywords/categories），
# 内部 workspace 无需强制；发布到 crates.io 时移除本行并补全 metadata
cargo_common_metadata = "allow"
# 传递依赖的多版本不受本仓库控制，无法消除
multiple_crate_versions = "allow"
# 中文文档中夹杂标识符（OpenAI、stop_reason 等）会大量误报，收益低于噪音
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
