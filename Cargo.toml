[workspace]
resolver = "3"
members = [
  "crates/ai/nomic-ai",
  "crates/core/nomic-core",
  "crates/server/nomic-server",
  "crates/tui/nomic-tui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/zineyu/nomic"

# ── Lint 配置：严格但实用 ────────────────────────────────────────────────────
# 所有 crate 通过 `[lints] workspace = true` 继承。
# - rustc / clippy::all / pedantic / nursery / cargo 全部 deny
# - 少数公认噪音大的 lint 显式 allow（有理由、可枚举）
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# 错误传播：可能失败的公共接口必须写明失败条件
missing_errors_doc = "deny"
# panic 属于契约的一部分：可能 panic 的公共接口必须写明触发条件
missing_panics_doc = "deny"

# 禁止调试残留：提交的代码不得输出到 stdout 或保留待办标记
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
# 屏蔽 lint 必须给出理由，禁止无说明的 #[allow]
allow_attributes_without_reason = "deny"

# 模块名重复在领域建模中常常是可读性更好的选择
module_name_repetitions = "allow"
# 每个返回值的函数都标 #[must_use] 过于繁琐
must_use_candidate = "allow"
# nursery 中纯风格偏好、与主流习惯冲突的 lint
use_self = "allow"
option_if_let_else = "allow"
# cargo 组中要求 crates.io 发布元数据（readme/keywords/categories），
# 内部 workspace 无需强制；发布到 crates.io 时移除本行并补全 metadata
cargo_common_metadata = "allow"
# 传递依赖的多版本不受本仓库控制，无法消除
multiple_crate_versions = "allow"
# 中文文档中夹杂标识符（OpenAI、stop_reason 等）会大量误报，收益低于噪音
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
