# git-cliff 配置：从 conventional commits 生成 CHANGELOG.md 与 Release notes
# 用法：
#   release 脚本自动调用：git-cliff --tag vX.Y.Z -o CHANGELOG.md
#   预览下个版本内容：    git-cliff --unreleased

[changelog]
header = """
# Changelog

所有值得关注的变更记录于本文件。

格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，
版本号遵循 [Semantic Versioning](https://semver.org/lang/zh-CN/)，
由 [git-cliff](https://git-cliff.org) 从 conventional commits 自动生成。

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first | trim }}
    {%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# 分组规则自上而下匹配，先命中先生效；分组名即 CHANGELOG 中的小节标题
commit_parsers = [
  { message = "^feat", group = "新功能" },
  { message = "^fix", group = "修复" },
  { message = "^perf", group = "性能优化" },
  { message = "^refactor", group = "重构" },
  { message = "^revert", group = "回滚" },
  { message = "^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "构建" },
  { message = "^style", group = "代码风格" },
  # release commit 自身不进 CHANGELOG
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "杂项" },
  { body = ".*BREAKING CHANGE", group = "破坏性变更" },
  { message = ".*", group = "其他" },
]

protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
